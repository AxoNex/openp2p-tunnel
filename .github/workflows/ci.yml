name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-canary:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 构建并打包 (canary)
        run: sh build.sh --canary --fetch-binary

      - name: 上传 canary 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: openp2p-tunnel-canary
          path: openp2p-tunnel-canary.zip
          retention-days: 30

      - name: 更新 canary release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete canary --yes --cleanup-tag 2>/dev/null || true
          gh release create canary openp2p-tunnel-canary.zip \
            --prerelease \
            --title "Canary Build" \
            --notes "⚠️ 自动构建的 Canary 测试版（对应 main 分支最新提交 ${GITHUB_SHA}）。仅用于测试，不建议生产环境。"
