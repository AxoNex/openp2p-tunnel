name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-canary:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.22.0

      - name: 设置 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 构建并打包 (canary)
        run: sh build.sh --canary --fetch-binary

      - name: 上传 canary 构建产物
        uses: actions/upload-artifact@v6
        with:
          name: openp2p-tunnel-canary
          path: openp2p-tunnel-canary.zip
          retention-days: 30
